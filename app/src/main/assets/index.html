<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pocket Pi</title>
<style>
:root{--bg:#0b0e14;--card:#151a24;--fg:#e6e6e6;--acc:#4cc38a;--dim:#8b95a7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:14px 16px;background:var(--card);display:flex;align-items:center;gap:8px}
header b{color:var(--acc)}
#ver{margin-left:auto;color:var(--dim);font-size:12px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;background:var(--card);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:#1d3a5f}
footer{display:flex;gap:8px;padding:12px;background:var(--card)}
#in{flex:1;padding:12px;border-radius:12px;border:1px solid #2a3140;background:var(--bg);color:var(--fg);font-size:16px}
#send{padding:12px 20px;border:none;border-radius:12px;background:var(--acc);color:#04110b;font-weight:700}
</style>
</head>
<body>
<header><b>⚡ Pocket Pi</b><span id="ver"></span></header>
<div id="log"></div>
<footer><input id="in" placeholder="跟我说点什么…"><button id="send">发送</button></footer>
<script>
const log=document.getElementById('log');
function add(t,me){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;}
add('Pocket Pi 桩版启动成功。JS<->Native 桥已通。试试随便说点啥。');
try{document.getElementById('ver').textContent=window.native.version();}catch(e){document.getElementById('ver').textContent='bridge: pending';}
document.getElementById('send').onclick=send;
document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
function send(){const i=document.getElementById('in');const t=i.value.trim();if(!t)return;i.value='';add(t,true);
  try{add(window.native.echo(t));}catch(e){add('bridge err: '+e);}}
</script>
</body>
</html>
