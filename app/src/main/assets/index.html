<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pocket Pi</title>
<link rel="stylesheet" href="xterm.css">
<style>
:root{--bg:#0b0e14;--card:#151a24;--fg:#e6e6e6;--acc:#4cc38a;--dim:#8b95a7;--warn:#e8a72e;--err:#e85c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;background:var(--card);display:flex;align-items:center;gap:8px;border-bottom:1px solid #1f2533}
header b{color:var(--acc)}
#ver{margin-left:auto;color:var(--dim);font-size:11px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid #1f2533}
.tab{flex:1;padding:8px;text-align:center;color:var(--dim);font-size:13px;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
#terminal-container{flex:1;display:none;flex-direction:column;padding:4px}
#term-screen{flex:1;overflow:hidden;padding:4px}
#term-input-bar{display:flex;gap:8px;padding:6px 8px;background:var(--card)}
#term-input{flex:1;padding:8px 12px;border-radius:8px;border:1px solid #2a3140;background:var(--bg);color:var(--fg);font:13px monospace}
#term-send{padding:8px 16px;border:none;border-radius:8px;background:var(--acc);color:#04110b;font-weight:700;cursor:pointer}
#info{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:8px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-break:break-all}
.msg.me{align-self:flex-end;background:#1d3a5f}
.msg.ok{border-left:3px solid var(--acc)}
.msg.bad{border-left:3px solid var(--err);color:#ffd7d7}
.info-item{display:flex;justify-content:space-between;padding:8px 12px;background:var(--card);border-radius:8px}
.info-item span:first-child{color:var(--dim)}
.info-item span:last-child{color:var(--acc)}
</style>
</head>
<body>
<header><b>⚡ Pocket Pi</b><span id="ver"></span></header>
<div class="tabs">
<div class="tab active" data-tab="term">终端</div>
<div class="tab" data-tab="chat">论断</div>
<div class="tab" data-tab="info">信息</div>
</div>
<div id="terminal-container">
<div id="term-screen"></div>
<div id="term-input-bar">
<input id="term-input" placeholder="$ _" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<button id="term-send">发送</button>
</div>
</div>
<div id="log" style="display:none"></div>
<div id="info"></div>
<script src="xterm.js"></script>
<script>
var NATIVE = window.native || {};
var ver = '?';
try { ver = NATIVE.version(); } catch(e) { ver = 'BRIDGE-DOWN'; }
document.getElementById('ver').textContent = ver;

// === Xterm.js Terminal ===
var term = new Terminal({
  cols: 80,
  rows: 24,
  cursorBlink: true,
  fontSize: 13,
  fontFamily: 'monospace',
  theme: {
    background: '#0b0e14',
    foreground: '#e6e6e6',
    cursor: '#4cc38a',
    selectionBackground: '#1d3a5f'
  }
});
term.open(document.getElementById('term-screen'));
term.writeln('\x1b[1;32m⚡ Pocket Pi ' + ver + '\x1b[0m');
term.writeln('\x1b[1;90m实时终端 · xterm.js 5.5.0\x1b[0m');
term.writeln('');

// Stream callback for shellStream
term.writeln('\x1b[90m[引擎] 桥接点检查...\x1b[0m');
try {
  var sy = NATIVE.sysinfo();
  var si = JSON.parse(sy);
  term.writeln('\x1b[32m  OK \u2500 ' + si.brand + ' ' + si.model + ' / Android ' + si.release + ' (SDK ' + si.sdk + ')\x1b[0m');
} catch(e) {
  term.writeln('\x1b[31m  FAIL \u2500 sysinfo: ' + e + '\x1b[0m');n}
term.writeln('');
term.writeln('\x1b[90m输入命令回车执行，试试: uname -a / ls / pwd / whoami\x1b[0m');
term.writeln('');

var cmdBuffer = '';
var streamCount = 0;

// Stream callback
term.writeln('\x1b[90m[引擎] 流式输出桥\x1b[0m');
try {
  if (NATIVE.shellStream) {
    term.writeln('\x1b[32m  OK \u2500 shellStream() \u53ef\u7528\x1b[0m');
  } else {
    term.writeln('\x1b[33m  WARN \u2500 shellStream() \u4e0d\u53ef\u7528\uff0c\u56de\u9000\u540c\u6b65 shell()\x1b[0m');
  }
} catch(e) {
  term.writeln('\x1b[33m  WARN \u2500 ' + e + '\x1b[0m');
}
term.writeln('');

term.write('\x1b[1;32m$ \x1b[0m');

window.termOnStream = function(type, id, data) {
  if (type === 'start') return;
  if (type === 'stdout') {
    term.write(data);
  } else if (type === 'stderr') {
    term.write('\x1b[31m' + data + '\x1b[0m');
  } else if (type === 'exit') {
    term.write('\n\x1b[1;32m$ \x1b[0m');
  }
};

var termInput = document.getElementById('term-input');
var termSend = document.getElementById('term-send');

function runTerm() {
  var cmd = termInput.value.trim();
  if (!cmd) return;
  termInput.value = '';
  term.writeln('\x1b[1;32m$ ' + cmd + '\x1b[0m');
  
  if (NATIVE.shellStream) {
    streamCount++;
    NATIVE.shellStream(cmd);
  } else if (NATIVE.shell) {
    try {
      var out = NATIVE.shell(cmd);
      term.write(out);
    } catch(e) {
      term.write('\x1b[31m' + e + '\x1b[0m');
    }
    term.write('\n\x1b[1;32m$ \x1b[0m');
  }
}

termSend.onclick = runTerm;
termInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') runTerm();
});

// === Tabs ===
var activeTab = 'term';
var tabs = document.querySelectorAll('.tab');
for (var i = 0; i < tabs.length; i++) {
  (function(t) {
    t.onclick = function() {
      for (var k = 0; k < tabs.length; k++) tabs[k].classList.remove('active');
      t.classList.add('active');
      activeTab = t.dataset.tab;
      var tc = document.getElementById('terminal-container');
      var lg = document.getElementById('log');
      var inf = document.getElementById('info');
      tc.style.display = activeTab === 'term' ? 'flex' : 'none';
      lg.style.display = activeTab === 'chat' ? 'flex' : 'none';
      inf.style.display = activeTab === 'info' ? 'flex' : 'none';
      if (activeTab === 'info') showInfo();
      if (activeTab === 'term') setTimeout(function(){term.focus();}, 100);
    };
  })(tabs[i]);
}

// === Info Tab ===
function showInfo() {
  var info = document.getElementById('info');
  info.innerHTML = '';
  try {
    var s = JSON.parse(NATIVE.sysinfo());
    var items = [['\u54c1\u724c', s.brand], ['\u578b\u53f7', s.model], ['\u8bbe\u5907', s.device], ['\u5382\u5546', s.manufacturer], ['SDK', s.sdk], ['Android', s.release], ['\u6865', ver]];
    for (var i = 0; i < items.length; i++) {
      var d = document.createElement('div');
      d.className = 'info-item';
      var a = document.createElement('span'); a.textContent = items[i][0];
      var b = document.createElement('span'); b.textContent = items[i][1];
      d.appendChild(a); d.appendChild(b);
      info.appendChild(d);
    }
  } catch(e) {
    info.textContent = 'err ' + e;
  }
  try {
    var bat = JSON.parse(NATIVE.battery());
    var batItems = [['\u7535\u91cf', bat.level + '%'], ['\u6e29\u5ea6', bat.temperature + '\u00b0C'], ['\u72b6\u6001', bat.charging ? '\u5145\u7535\u4e2d' : '\u672a\u5145\u7535']];
    for (var i = 0; i < batItems.length; i++) {
      var d = document.createElement('div');
      d.className = 'info-item';
      var a = document.createElement('span'); a.textContent = batItems[i][0];
      var b = document.createElement('span'); b.textContent = batItems[i][1];
      d.appendChild(a); d.appendChild(b);
      info.appendChild(d);
    }
  } catch(e) {}
  try {
    var st = JSON.parse(NATIVE.storage());
    var stItems = [['\u603b\u7a7a\u95f4', Math.round(st.total / 1048576) + ' MB'], ['\u53ef\u7528', Math.round(st.free / 1048576) + ' MB'], ['\u5df2\u7528', Math.round(st.used / 1048576) + ' MB']];
    for (var i = 0; i < stItems.length; i++) {
      var d = document.createElement('div');
      d.className = 'info-item';
      var a = document.createElement('span'); a.textContent = stItems[i][0];
      var b = document.createElement('span'); b.textContent = stItems[i][1];
      d.appendChild(a); d.appendChild(b);
      info.appendChild(d);
    }
  } catch(e) {}
}

// === Chat/Diagnostic Tab ===
var logEl = document.getElementById('log');
function addMsg(t, cls) {
  var d = document.createElement('div');
  d.className = 'msg' + (cls ? ' ' + cls : '');
  d.textContent = t;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
addMsg('Pocket Pi ' + ver + ' \u542f\u52a8', 'ok');
try {
  var sy2 = NATIVE.sysinfo();
  var j2 = JSON.parse(sy2);
  addMsg('BRIDGE OK\nsysinfo: ' + j2.brand + ' ' + j2.model + '\nAndroid ' + j2.release + ' (sdk ' + j2.sdk + ')', 'ok');
} catch(e) {
  addMsg('sysinfo FAIL: ' + e, 'bad');
}
try {
  var u = NATIVE.shell('uname -a');
  addMsg('shell(uname -a):\n' + u, 'ok');
} catch(e) {
  addMsg('shell FAIL: ' + e, 'bad');
}
try {
  var t2 = NATIVE.shell('id');
  addMsg('shell(id):\n' + t2, 'ok');
} catch(e) {
  addMsg('id FAIL: ' + e, 'bad');
}
addMsg('\u81ea\u8bca\u65ad\u5b8c\u6210: \u82e5\u4e0a\u65b9\u5168\u662f OK \u5219 JS-Native \u6865+shell \u5168\u901a', 'ok');
</script>
</body>
</html>
