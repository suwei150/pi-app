<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pocket Pi</title>
<style>
:root{--bg:#0b0e14;--card:#151a24;--fg:#e6e6e6;--acc:#4cc38a;--dim:#8b95a7;--warn:#e8a72e;--err:#e85c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;background:var(--card);display:flex;align-items:center;gap:8px;border-bottom:1px solid #1f2533}
header b{color:var(--acc)}
#ver{margin-left:auto;color:var(--dim);font-size:11px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid #1f2533}
.tab{flex:1;padding:8px;text-align:center;color:var(--dim);font-size:13px;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-break:break-all}
.msg.me{align-self:flex-end;background:#1d3a5f}
.msg.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;border:1px dashed #2a3140}
.msg.err{color:var(--err)}
#term{flex:1;overflow-y:auto;padding:12px;display:none;flex-direction:column;gap:4px}
.term-line{font:12px/1.4 monospace;color:var(--acc);white-space:pre-wrap;word-break:break-all}
.term-line.err{color:var(--err)}
.term-line.cmd{color:var(--dim)}
footer{display:flex;gap:8px;padding:10px;background:var(--card)}
#in{flex:1;padding:10px;border-radius:10px;border:1px solid #2a3140;background:var(--bg);color:var(--fg);font-size:14px}
#send{padding:10px 18px;border:none;border-radius:10px;background:var(--acc);color:#04110b;font-weight:700;cursor:pointer}
#send:active{opacity:0.7}
</style>
</head>
<body>
<header><b>⚡ Pocket Pi</b><span id="ver"></span></header>
<div class="tabs">
<div class="tab active" data-tab="chat">聊天</div>
<div class="tab" data-tab="term">终端</div>
<div class="tab" data-tab="info">信息</div>
</div>
<div id="log" style="display:flex"></div>
<div id="term"></div>
<div id="info" style="display:none;flex:1;overflow-y:auto;padding:16px;gap:8px;flex-direction:column"></div>
<footer><input id="in" placeholder="输入消息或命令..."><button id="send">发送</button></footer>
<script>
const log=document.getElementById('log');
const term=document.getElementById('term');
const info=document.getElementById('info');
const inp=document.getElementById('in');

function add(t,me,cls){const d=document.createElement('div');d.className='msg'+(cls?' '+cls:'')+(me?' me':'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function termAdd(t,cls){const d=document.createElement('div');d.className='term-line'+(cls?' '+cls:'');d.textContent=t;term.appendChild(d);term.scrollTop=term.scrollHeight;}

add('Pocket Pi M1.5 启动。WebView调试模式已开。JS<->Native桥已通。');
add('提示: 终端标签页可跑 shell 命令，信息标签页看系统信息。');

try{document.getElementById('ver').textContent=window.native.version();}
catch(e){document.getElementById('ver').textContent='bridge: pending';}

let activeTab='chat';
document.querySelectorAll('.tab').forEach(t=>{
t.onclick=()=>{
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
t.classList.add('active');
activeTab=t.dataset.tab;
log.style.display=activeTab==='chat'?'flex':'none';
term.style.display=activeTab==='term'?'flex':'none';
info.style.display=activeTab==='info'?'flex':'none';
if(activeTab==='info')showInfo();
};
});

function showInfo(){
info.innerHTML='';
try{
const s=JSON.parse(window.native.sysinfo());
const items=[['品牌',s.brand],['型号',s.model],['设备',s.device],['厂商',s.manufacturer],['SDK',s.sdk],['版本',s.release]];
items.forEach(([k,v])=>{const d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;padding:8px 12px;background:var(--card);border-radius:8px';d.innerHTML='<span style=color:var(--dim)>'+k+'</span><span style=color:var(--acc)>'+v+'</span>';info.appendChild(d);});
}catch(e){const d=document.createElement('div');d.textContent='err: '+e;info.appendChild(d);}
}

document.getElementById('send').onclick=run;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')run();});

function run(){
const t=inp.value.trim();if(!t)return;inp.value='';
if(activeTab==='chat'){
add(t,true);
try{add(window.native.echo(t));}catch(e){add('bridge err: '+e,'err');}
}else if(activeTab==='term'){
termAdd('$ '+t,'cmd');
try{const out=window.native.shell(t);out.split('\n').forEach(l=>termAdd(l));}catch(e){termAdd('err: '+e,'err');}
}else if(activeTab==='info'){
showInfo();
}
}
</script>
</body>
</html>
