<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pocket Pi</title>
<style>
:root{--bg:#0b0e14;--card:#151a24;--fg:#e6e6e6;--acc:#4cc38a;--dim:#8b95a7;--warn:#e8a72e;--err:#e85c5c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;background:var(--card);display:flex;align-items:center;gap:8px;border-bottom:1px solid #1f2533}
header b{color:var(--acc)}
#ver{margin-left:auto;color:var(--dim);font-size:11px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid #1f2533}
.tab{flex:1;padding:8px;text-align:center;color:var(--dim);font-size:13px;border-bottom:2px solid transparent;cursor:pointer}
.tab.active{color:var(--acc);border-bottom-color:var(--acc)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-break:break-all}
.msg.me{align-self:flex-end;background:#1d3a5f}
.msg.ok{border-left:3px solid var(--acc)}
.msg.bad{border-left:3px solid var(--err);color:#ffd7d7}
#term{flex:1;overflow-y:auto;padding:12px;display:none;flex-direction:column;gap:4px}
.term-line{font:12px/1.4 monospace;color:var(--acc);white-space:pre-wrap;word-break:break-all}
.term-line.err{color:var(--err)}
.term-line.cmd{color:var(--dim)}
#info{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:8px}
footer{display:flex;gap:8px;padding:10px;background:var(--card)}
#in{flex:1;padding:10px;border-radius:10px;border:1px solid #2a3140;background:var(--bg);color:var(--fg);font-size:14px}
#send{padding:10px 18px;border:none;border-radius:10px;background:var(--acc);color:#04110b;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><b>⚡ Pocket Pi</b><span id="ver"></span></header>
<div class="tabs">
<div class="tab active" data-tab="chat">自诊断</div>
<div class="tab" data-tab="term">终端</div>
<div class="tab" data-tab="info">信息</div>
</div>
<div id="log" style="display:flex"></div>
<div id="term"></div>
<div id="info"></div>
<footer><input id="in" placeholder="命令/消息..."><button id="send">发送</button></footer>
<script>
var log=document.getElementById('log');
var term=document.getElementById('term');
var info=document.getElementById('info');
var inp=document.getElementById('in');
function add(t,cls){var d=document.createElement('div');d.className='msg'+(cls?' '+cls:'');d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight;}
function termAdd(t,cls){var d=document.createElement('div');d.className='term-line'+(cls?' '+cls:'');d.textContent=t;term.appendChild(d);term.scrollTop=term.scrollHeight;}
var ver='?';
try{ver=window.native.version();}catch(e){ver='BRIDGE-DOWN';}
document.getElementById('ver').textContent=ver;
add('Pocket Pi '+ver+' 启动');
try{var sy=window.native.sysinfo();var j=JSON.parse(sy);add('BRIDGE OK\nsysinfo: '+j.brand+' '+j.model+'\nAndroid '+j.release+' (sdk '+j.sdk+')','ok');}catch(e){add('sysinfo FAIL: '+e,'bad');}
try{var u=window.native.shell('uname -a');add('shell(uname -a):\n'+u,'ok');}catch(e){add('shell FAIL: '+e,'bad');}
try{var t2=window.native.shell('id');add('shell(id):\n'+t2,'ok');}catch(e){add('id FAIL: '+e,'bad');}
try{var d=window.native.shell('getprop ro.build.version.incremental');add('build.incremental: '+d,'ok');}catch(e){add('getprop FAIL: '+e,'bad');}
add('自诊断完成: 若上方全是 OK 则 JS-Native 桥+shell 全通','ok');
var activeTab='chat';
var tabs=document.querySelectorAll('.tab');
for(var i=0;i<tabs.length;i++){(function(t){t.onclick=function(){
for(var k=0;k<tabs.length;k++)tabs[k].classList.remove('active');
t.classList.add('active');activeTab=t.dataset.tab;
log.style.display=activeTab==='chat'?'flex':'none';
term.style.display=activeTab==='term'?'flex':'none';
info.display;info.style.display=activeTab==='info'?'flex':'none';
if(activeTab==='info')showInfo();};})(tabs[i]);}
function showInfo(){info.innerHTML='';try{var s=JSON.parse(window.native.sysinfo());var items=[['品牌',s.brand],['型号',s.model],['设备',s.device],['厂商',s.manufacturer],['SDK',s.sdk],['Android',s.release],['桥',ver]];for(var i=0;i<items.length;i++){var d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;padding:8px 12px;background:var(--card);border-radius:8px';var a=document.createElement('span');a.style.color='var(--dim)';a.textContent=items[i][0];var b=document.createElement('span');b.style.color='var(--acc)';b.textContent=items[i][1];d.appendChild(a);d.appendChild(b);info.appendChild(d);}}catch(e){var d=document.createElement('div');d.textContent='err '+e;info.appendChild(d);}}
document.getElementById('send').onclick=run;
inp.addEventListener('keydown',function(e){if(e.key==='Enter')run();});
function run(){var t=inp.value.trim();if(!t)return;inp.value='';
if(activeTab==='chat'){add('你: '+t,'me');try{add(window.native.echo(t),'ok');}catch(e){add('err '+e,'bad');}}
else if(activeTab==='term'){termAdd('$ '+t,'cmd');try{var o=window.native.shell(t);var ls=o.split(String.fromCharCode(10));for(var i=0;i<ls.length;i++)termAdd(ls[i]);}catch(e){termAdd('err '+e,'err');}}
else{showInfo();}}
</script>
</body>
</html>
