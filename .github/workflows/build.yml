name: build-apk
on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/**'
      - 'keystore/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools platforms;android-34'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Decode keystore
        run: |
          mkdir -p keystore
          base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore
      - name: Download xterm.js assets
        run: |
          mkdir -p app/src/main/assets
          curl -sL https://unpkg.com/@xterm/xterm@5.5.0/lib/xterm.js -o app/src/main/assets/xterm.js
          curl -sL https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css -o app/src/main/assets/xterm.css
          ls -la app/src/main/assets/
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-pi-debug
          path: app/build/outputs/apk/debug/*.apk
